<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Optical Transfer Pro - Ultimate</title>
    <style>
        :root {
            --bg-dark: #070a13; --bg-card: rgba(15, 23, 42, 0.85);
            --teal-accent: #00f5d4; --text-light: #f8fafc;
            --btn-tx: linear-gradient(135deg, #005f73 0%, #00a896 100%);
            --btn-rx: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
            --btn-dl: linear-gradient(135deg, #38b000 0%, #008000 100%);
            --btn-go: linear-gradient(135deg, #fca311 0%, #ffb703 100%);
            --btn-home: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            --btn-install: linear-gradient(135deg, #e63946 0%, #d62828 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-light); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header & Progress Bar */
        #headerContainer { background: rgba(13, 27, 42, 0.9); border-bottom: 1px solid rgba(0, 245, 212, 0.2); }
        #headerInfo { color: var(--teal-accent); font-size: 11px; padding: 10px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        #progressContainer { width: 100%; height: 8px; background: rgba(255,255,255,0.1); }
        #progressBar { width: 0%; height: 100%; background: var(--teal-accent); transition: width 0.2s linear; }
        
        #controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: rgba(10, 17, 40, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10; }
        #fileInput { display: none; }
        
        button { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 8px; color: white; font-size: 12px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #btnHome { background: var(--btn-home); max-width: 50px; font-size: 16px; }
        #btnInstall { background: var(--btn-install); max-width: 50px; font-size: 16px; }
        #btnTx { background: var(--btn-tx); }
        #btnRx { background: var(--btn-rx); }
        #btnDl { background: var(--btn-dl); display: none; }
        #btnVai { background: var(--btn-go); display: none; flex: 2; color: #000; }
        
        button:active { filter: brightness(0.8); transform: translateY(2px); }

        #viewContainer { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #txCanvas { width: 100%; height: 100%; display: none; }
        #rxVideo { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        #rxGuide { display: none; position: absolute; top: 10%; left: 5%; right: 5%; bottom: 15%; border: 3px dashed var(--teal-accent); border-radius: 12px; pointer-events: none; z-index: 5; box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); }
        #rxNoticeBanner { display: none; position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(234, 179, 8, 0.95); color: #000; padding: 10px; font-size: 11px; border-radius: 6px; font-weight: bold; text-align: center; z-index: 20; }

        #statusOverlay { position: absolute; bottom: 16px; left: 16px; right: 16px; background: var(--bg-card); color: var(--teal-accent); padding: 12px; font-size: 12px; font-family: monospace; border: 1px solid rgba(0, 245, 212, 0.25); border-radius: 8px; pointer-events: none; z-index: 10; text-align: center; }

        /* Modals */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--teal-accent); padding: 20px; border-radius: 12px; text-align: center; width: 100%; max-width: 350px; }
        .modal-box h3 { margin-bottom: 10px; color: white; }
        .modal-box p { font-size: 13px; color: #ccc; margin-bottom: 20px; }
        .modal-btns { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div id="headerContainer">
        <div id="headerInfo">
            <span>⏳ ETA: <span id="timeDisplay">0.0s</span></span>
            <span>📦 Dati: <span id="dataDisplay">0%</span></span>
        </div>
        <div id="progressContainer"><div id="progressBar"></div></div>
    </div>
    
    <div id="controls">
        <button id="btnHome" onclick="resetToHome()" title="Home">🏠</button>
        <button id="btnInstall" onclick="showInstallModal()" title="Installa App">📲</button>
        <input type="file" id="fileInput" accept="*/*">
        <button id="btnTx" onclick="triggerFileSelect()">📡 Carica File</button>
        <button id="btnVai" onclick="startCountdown()">🚀 VAI (Avvia)</button>
        <button id="btnRx" onclick="startReceiver()">👁️ Ricevi</button>
        <button id="btnDl" onclick="downloadReceivedFile()">💾 Scarica File</button>
    </div>

    <div id="viewContainer">
        <div id="rxNoticeBanner">Mantieni l'inquadratura. A trasmissione finita, premi "SCARICA FILE".</div>
        <canvas id="txCanvas"></canvas>
        <video id="rxVideo" autoplay playsinline></video>
        <div id="rxGuide"></div>
        <div id="statusOverlay">Pronto. Scegli "Carica File" o "Ricevi".</div>
    </div>

    <div id="compressionModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Vuoi comprimere il file?</h3>
            <p>La compressione riduce i tempi di trasmissione per documenti e testi. (Per foto o ZIP è sconsigliata).</p>
            <div class="modal-btns">
                <button style="background: var(--btn-tx);" onclick="processFileSelection(true)">Sì, Comprimi</button>
                <button style="background: #4a5568;" onclick="processFileSelection(false)">No, Originale</button>
            </div>
        </div>
    </div>

    <div id="installModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Come Installare l'App</h3>
            <p id="installText"></p>
            <button style="background: var(--btn-rx); width: 100%;" onclick="document.getElementById('installModal').style.display='none'">Ho Capito</button>
        </div>
    </div>

    <script>
        const PALETTE = [
            [0,0,0], [255,255,255], [255,0,0], [0,255,0],
            [0,0,255], [255,255,0], [0,255,255], [255,0,255],
            [255,128,0], [128,0,128], [128,255,0], [255,192,203],
            [0,128,128], [139,69,19], [128,128,128], [180,255,0]
        ];

        let txInterval = null, rxInterval = null, countdownInterval = null;
        let packetsList = [];
        let fileMetadata = { name: "file.bin", type: "application/octet-stream", compressed: false, totalPackets: 0 };
        let currentPacketIdx = 0;
        let totalPacketsCount = 0;
        let receivedPacketsMap = new Map();
        let isReceiving = false;
        let pendingFileBuffer = null;

        const CELL_SIZE = 12; 
        const CHUNK_SIZE = 1800; 
        const FRAME_TIME_MS = 60;

        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('txCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const video = document.getElementById('rxVideo');
        const progressBar = document.getElementById('progressBar');

        function resetToHome() {
            if (txInterval) clearInterval(txInterval);
            if (rxInterval) clearInterval(rxInterval);
            if (countdownInterval) clearInterval(countdownInterval);
            if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

            isReceiving = false; packetsList = []; receivedPacketsMap.clear();
            currentPacketIdx = 0; totalPacketsCount = 0; pendingFileBuffer = null;
            progressBar.style.width = "0%";

            canvas.style.display = 'none'; video.style.display = 'none';
            document.getElementById('rxGuide').style.display = 'none';
            document.getElementById('rxNoticeBanner').style.display = 'none';
            
            document.getElementById('btnTx').style.display = 'flex';
            document.getElementById('btnRx').style.display = 'flex';
            document.getElementById('btnVai').style.display = 'none';
            document.getElementById('btnDl').style.display = 'none';

            document.getElementById('timeDisplay').innerText = "0.0s";
            document.getElementById('dataDisplay').innerText = "0%";
            updateStatus("PRONTO", "Seleziona 'Carica File' per trasmettere o 'Ricevi' per acquisire.");
        }

        function showInstallModal() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            let text = isIOS 
                ? "Su iPhone/iPad: tocca il tasto <b>Condividi</b> (il quadrato con la freccia in su) in basso e seleziona <b>'Aggiungi alla schermata Home'</b>." 
                : "Su Android: tocca i <b>tre puntini</b> in alto a destra nel browser e seleziona <b>'Installa app'</b> o <b>'Aggiungi a schermata Home'</b>.";
            document.getElementById('installText').innerHTML = text;
            document.getElementById('installModal').style.display = 'flex';
        }

        function triggerFileSelect() { fileInput.click(); }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            fileMetadata.name = file.name;
            fileMetadata.type = file.type || "application/octet-stream";
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                pendingFileBuffer = new Uint8Array(ev.target.result);
                document.getElementById('compressionModal').style.display = 'flex';
            };
            reader.readAsArrayBuffer(file);
        });

        async function processFileSelection(useCompression) {
            document.getElementById('compressionModal').style.display = 'none';
            updateStatus("ELABORAZIONE...", "Preparazione dei dati in corso.");
            
            let finalBuffer = pendingFileBuffer;
            fileMetadata.compressed = false;

            if (useCompression) {
                try {
                    const stream = new Blob([pendingFileBuffer]).stream();
                    const compressedStream = stream.pipeThrough(new CompressionStream('deflate'));
                    finalBuffer = new Uint8Array(await (new Response(compressedStream)).arrayBuffer());
                    fileMetadata.compressed = true;
                } catch(e) {
                    console.warn("Compressione non supportata dal browser, uso file originale.");
                }
            }

            // Prepara i pacchetti
            packetsList = [];
            
            // Calcola quanti pacchetti totali (dati veri) ci saranno per il ricevitore
            const dataChunksCount = Math.ceil(finalBuffer.length / CHUNK_SIZE);
            fileMetadata.totalPackets = dataChunksCount;

            // Pacchetto 0: Metadati
            const metaString = JSON.stringify(fileMetadata);
            const metaBytes = new TextEncoder().encode(metaString);
            let metaChk = metaBytes.reduce((acc, val) => acc ^ val, 0);
            packetsList.push({ id: 0, data: metaBytes, chk: metaChk });

            // Pacchetti Dati
            for (let i = 0; i < finalBuffer.length; i += CHUNK_SIZE) {
                let chunk = finalBuffer.slice(i, i + CHUNK_SIZE);
                let checksum = chunk.reduce((acc, val) => acc ^ val, 0);
                packetsList.push({ id: packetsList.length, data: chunk, chk: checksum });
            }

            totalPacketsCount = packetsList.length;
            let etaSeconds = (totalPacketsCount * FRAME_TIME_MS) / 1000;
            document.getElementById('timeDisplay').innerText = `${etaSeconds.toFixed(1)}s`;
            
            document.getElementById('btnTx').style.display = 'none';
            document.getElementById('btnRx').style.display = 'none';
            document.getElementById('btnVai').style.display = 'flex';
            updateStatus("FILE PRONTO", `Compresso: ${fileMetadata.compressed ? 'Sì' : 'No'} | Clicca VAI.`);
        }

        function startCountdown() {
            document.getElementById('btnVai').style.display = 'none';
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - document.getElementById('controls').offsetHeight - 50;
            
            let count = 5;
            updateStatus("PREPARAZIONE", "Inquadra questo schermo.");
            
            countdownInterval = setInterval(() => {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'var(--teal-accent)'; ctx.font = 'bold 100px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(count, canvas.width / 2, canvas.height / 2);
                
                if (count === 0) {
                    clearInterval(countdownInterval);
                    executeTransmission();
                }
                count--;
            }, 1000);
        }

        function executeTransmission() {
            currentPacketIdx = 0;
            updateStatus("TRASMISSIONE IN CORSO", "Non muovere i dispositivi!");
            txInterval = setInterval(drawBalancedFrame, FRAME_TIME_MS); 
        }

        function drawBalancedFrame() {
            const w = canvas.width; const h = canvas.height;
            
            // Aggiorna Barra di Progresso
            let progress = (currentPacketIdx / totalPacketsCount) * 100;
            progressBar.style.width = `${progress}%`;
            document.getElementById('dataDisplay').innerText = `${Math.floor(progress)}%`;

            if (currentPacketIdx >= totalPacketsCount) {
                clearInterval(txInterval);
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'var(--teal-accent)'; ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center'; ctx.fillText("FILE TRASMESSO", w / 2, h / 2);
                updateStatus("COMPLETATO", "Premi 'Scarica File' sul ricevitore.");
                progressBar.style.width = `100%`;
                return;
            }

            const isPortrait = h > w; 
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);

            let pkt = packetsList[currentPacketIdx];
            let headerBytes = [ pkt.id >> 8, pkt.id & 0xFF, pkt.chk, pkt.data.length >> 8, pkt.data.length & 0xFF ];
            let payload = new Uint8Array(headerBytes.length + pkt.data.length);
            payload.set(headerBytes); payload.set(pkt.data, headerBytes.length);

            let startX = 0, startY = 0, cols = 0, rows = 0;

            if (isPortrait) {
                let barHeight = h / 16; let barWidth = 40;
                for (let i = 0; i < 16; i++) {
                    ctx.fillStyle = `rgb(${PALETTE[i].join(',')})`; ctx.fillRect(0, i * barHeight, barWidth, barHeight);
                }
                startX = barWidth; startY = 0;
                cols = Math.floor((w - barWidth) / CELL_SIZE); rows = Math.floor(h / CELL_SIZE);
            } else {
                let barWidth = w / 16; let barHeight = 40;
                for (let i = 0; i < 16; i++) {
                    ctx.fillStyle = `rgb(${PALETTE[i].join(',')})`; ctx.fillRect(i * barWidth, 0, barWidth, barHeight);
                }
                startX = 0; startY = barHeight;
                cols = Math.floor(w / CELL_SIZE); rows = Math.floor((h - barHeight) / CELL_SIZE);
            }

            let cellIdx = 0;
            for (let r = 0; r < rows && cellIdx < payload.length; r++) {
                for (let c = 0; c < cols && cellIdx < payload.length; c++) {
                    let colorIdx = payload[cellIdx++] % 16;
                    ctx.fillStyle = `rgb(${PALETTE[colorIdx].join(',')})`;
                    ctx.fillRect(startX + (c * CELL_SIZE), startY + (r * CELL_SIZE), CELL_SIZE - 1, CELL_SIZE - 1);
                }
            }
            
            let packetsLeft = totalPacketsCount - currentPacketIdx;
            document.getElementById('timeDisplay').innerText = `${((packetsLeft * FRAME_TIME_MS) / 1000).toFixed(1)}s`;
            currentPacketIdx++;
        }

        async function startReceiver() {
            resetToHome();
            document.getElementById('btnTx').style.display = 'none';
            document.getElementById('btnRx').style.display = 'none';
            document.getElementById('btnInstall').style.display = 'none';
            document.getElementById('btnDl').style.display = 'flex';
            video.style.display = 'block';
            document.getElementById('rxGuide').style.display = 'block'; 
            document.getElementById('rxNoticeBanner').style.display = 'block';
            
            receivedPacketsMap.clear();
            isReceiving = true;
            fileMetadata.totalPackets = 0;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } });
                video.srcObject = stream;
                
                if (rxInterval) clearInterval(rxInterval);
                rxInterval = setInterval(processBalancedFrame, 45); 
                updateStatus("RICEZIONE ATTIVA", "Inquadra il trasmettitore.");
            } catch (err) {
                updateStatus("ERRORE", "Fotocamera non disponibile.");
            }
        }

        function processBalancedFrame() {
            if (!video.videoWidth || !isReceiving) return;
            
            const rxCanvas = document.createElement('canvas');
            rxCanvas.width = video.videoWidth; rxCanvas.height = video.videoHeight;
            const rxCtx = rxCanvas.getContext('2d', { willReadFrequently: true });
            rxCtx.drawImage(video, 0, 0, rxCanvas.width, rxCanvas.height);
            
            try {
                let scanStartX = rxCanvas.width * 0.05; let scanStartY = rxCanvas.height * 0.10;
                let scanW = rxCanvas.width * 0.90; let scanH = rxCanvas.height * 0.80;
                
                const imageData = rxCtx.getImageData(scanStartX, scanStartY, scanW, scanH);
                const pixels = imageData.data;
                let decodedBytes = [];

                for(let i = 0; i < pixels.length; i += 2800) {
                    let r = pixels[i], g = pixels[i+1], b = pixels[i+2];
                    let bestMatch = 0, minDiff = Infinity;
                    for(let p=0; p<16; p++) {
                        let diff = Math.abs(r-PALETTE[p][0]) + Math.abs(g-PALETTE[p][1]) + Math.abs(b-PALETTE[p][2]);
                        if(diff < minDiff) { minDiff = diff; bestMatch = p; }
                    }
                    decodedBytes.push(bestMatch);
                }

                if (decodedBytes.length < 5) return;

                let pktId = (decodedBytes[0] << 8) | decodedBytes[1];
                let expectedChk = decodedBytes[2];
                let dataLen = (decodedBytes[3] << 8) | decodedBytes[4];
                
                if (dataLen <= CHUNK_SIZE && dataLen > 0) {
                    let payload = new Uint8Array(decodedBytes.slice(5, 5 + dataLen));
                    let actualChk = payload.reduce((acc, val) => acc ^ val, 0);

                    if (actualChk === expectedChk) {
                        if (!receivedPacketsMap.has(pktId)) {
                            if (pktId === 0) {
