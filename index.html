<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Optical Transfer Pro PWA</title>
    <style>
        :root {
            --bg-dark: #070a13;
            --bg-card: rgba(15, 23, 42, 0.75);
            --primary-blue: #0f4c81;
            --teal-accent: #00f5d4;
            --teal-glow: rgba(0, 245, 212, 0.25);
            --blue-gradient: linear-gradient(135deg, #0d3b66 0%, #005f73 100%);
            --btn-gradient: linear-gradient(135deg, #005f73 0%, #00a896 100%);
            --btn-active: linear-gradient(135deg, #002b36 0%, #005f73 100%);
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-light); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* Banner Avviso PC */
        #pcNotice { 
            background: rgba(13, 27, 42, 0.9); 
            color: var(--teal-accent); 
            font-size: 11px; 
            padding: 8px 12px; 
            text-align: center; 
            border-bottom: 1px solid rgba(0, 245, 212, 0.2);
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* Barra di Controllo con i Pulsanti */
        #controls { 
            display: flex; 
            gap: 12px; 
            padding: 12px; 
            background: rgba(10, 17, 40, 0.85); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        button { 
            flex: 1; 
            padding: 14px; 
            font-weight: 700; 
            border: 1px solid rgba(0, 245, 212, 0.3); 
            border-radius: 12px; 
            background: var(--btn-gradient); 
            color: var(--text-light); 
            font-size: 13px; 
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--teal-glow);
            border-color: var(--teal-accent);
        }

        button:active { 
            transform: translateY(1px);
            background: var(--btn-active); 
        }

        /* Contenitore Principale Visuale */
        #viewContainer { 
            flex: 1; 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(circle at center, #0a192f 0%, #040711 100%);
        }

        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none; 
        }

        /* Status Bar / Overlay HUD */
        #statusOverlay { 
            position: absolute; 
            bottom: 16px; 
            left: 16px; 
            right: 16px; 
            background: var(--bg-card); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--teal-accent); 
            padding: 14px 18px; 
            font-size: 12px; 
            font-family: 'Courier New', monospace; 
            border: 1px solid rgba(0, 245, 212, 0.25); 
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            line-height: 1.5;
        }

        .status-title {
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="pcNotice">🖥️ AVVISO MONITOR PC: Imposta luminosità al 100% e webcam ad alta risoluzione.</div>
    
    <div id="controls">
        <button onclick="startTransmitter()">📡 TRASMETTI</button>
        <button onclick="startReceiver()">👁️ RICEVI</button>
    </div>

    <div id="viewContainer">
        <canvas id="txCanvas"></canvas>
        <video id="rxVideo" autoplay playsinline></video>
        <div id="statusOverlay">
            <div class="status-title">Stato Sistema</div>
            Seleziona una modalità in alto per iniziare...
        </div>
    </div>

    <script>
        // Palette 16 Colori Ottici Fissi (4 Bit per quadratino)
        const PALETTE = [
            [0,0,0], [255,255,255], [255,0,0], [0,255,0],
            [0,0,255], [255,255,0], [0,255,255], [255,0,255],
            [255,128,0], [128,0,128], [128,255,0], [255,192,203],
            [0,128,128], [139,69,19], [128,128,128], [180,255,0]
        ];

        const sampleData = "MESSAGGIO WEB PWA TRASMESSO OFFLINE CON SUCCESSO!";
        let txInterval = null, rxInterval = null;
        let currentPacketId = 0, lastReadPacketId = -1;
        const totalPackets = 10;
        let receivedBuffer = {};

        const canvas = document.getElementById('txCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('rxVideo');
        const statusOverlay = document.getElementById('statusOverlay');

        // --- MODALITÀ TRASMETTITORE ---
        function startTransmitter() {
            stopReceiver();
            video.style.display = 'none';
            canvas.style.display = 'block';
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 100;

            txInterval = setInterval(() => {
                currentPacketId++;
                drawTxFrame();
            }, 300); // 3.3 FPS per massima stabilità
            
            updateStatus("TRASMISSIONE IN CORSO", "Luminosità Schermo impostata al 100%\nGenerazione matrice colori e marcatori...");
        }

        function drawTxFrame() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.fillStyle = '#040711';
            ctx.fillRect(0, 0, w, h);

            // 1. Marcatori d'Angolo
            drawMarker(0, 0); drawMarker(w - 60, 0);
            drawMarker(0, h - 60); drawMarker(w - 60, h - 60);

            // 2. Striscia di Calibrazione
            const stripeW = (w - 120) / 16;
            for (let i = 0; i < 16; i++) {
                ctx.fillStyle = `rgb(${PALETTE[i].join(',')})`;
                ctx.fillRect(60 + (i * stripeW), 0, stripeW, 40);
                ctx.fillRect(60 + (i * stripeW), h - 40, stripeW, 40);
            }

            // 3. Griglia Dati (4x4)
            const cols = 4, rows = 4;
            const cellW = (w - 120) / cols;
            const cellH = (h - 200) / rows;
            const activePacket = (currentPacketId % totalPackets);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cellIdx = r * cols + c;
                    let colorIdx = 0;

                    if (cellIdx === 0) colorIdx = activePacket % 16; // Packet ID
                    else if (cellIdx === 1) colorIdx = (currentPacketId % 2 === 0) ? 1 : 0; // Sync Bit
                    else if (cellIdx === 15) colorIdx = (activePacket ^ 0x0A) % 16; // Parità XOR
                    else {
                        const charIdx = (activePacket * 4 + cellIdx) % sampleData.length;
                        colorIdx = sampleData.charCodeAt(charIdx) % 16;
                    }

                    ctx.fillStyle = `rgb(${PALETTE[colorIdx].join(',')})`;
                    ctx.fillRect(60 + (c * cellW) + 2, 80 + (r * cellH) + 2, cellW - 4, cellH - 4);
                }
            }
        }

        function drawMarker(x, y) {
            ctx.fillStyle = '#FFF'; ctx.fillRect(x, y, 60, 60);
            ctx.fillStyle = '#000'; ctx.fillRect(x + 15, y + 15, 30, 30);
        }

        // --- MODALITÀ RICEVITORE ---
        async function startReceiver() {
            clearInterval(txInterval);
            canvas.style.display = 'none';
            video.style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                
                rxInterval = setInterval(processRxFrame, 150);
                updateStatus("RICEZIONE ATTIVA", "Inquadra lo schermo trasmettitore...");
            } catch (err) {
                updateStatus("ERRORE FOTOCAMERA", err.message);
            }
        }

        function processRxFrame() {
            if (!video.videoWidth) return;

            const hiddenCanvas = document.createElement('canvas');
            hiddenCanvas.width = video.videoWidth;
            hiddenCanvas.height = video.videoHeight;
            const hCtx = hiddenCanvas.getContext('2d');
            hCtx.drawImage(video, 0, 0);

            const w = hiddenCanvas.width;
            const h = hiddenCanvas.height;

            // Campionamento dinamico calibrazione
            const dynamicPalette = sampleDynamicPalette(hCtx, w, h);

            // Lettura Cella Packet ID e Sync Bit
            const startX = w / 6, startY = h / 4;
            const stepX = (w * 2 / 3) / 4, stepY = (h / 2) / 4;

            const packetId = decodeColorAt(hCtx, startX + stepX/2, startY + stepY/2, dynamicPalette);

            if (packetId !== lastReadPacketId) {
                lastReadPacketId = packetId;
                receivedBuffer[packetId] = true;

                const count = Object.keys(receivedBuffer).length;
                
                if (count >= totalPackets) {
                    updateStatus("COMPLETATO (100%)", "Trasferimento terminato con successo senza errori!");
                } else {
                    updateStatus("ACQUISIZIONE IN CORSO", `Pacchetti ricevuti: ${count} / ${totalPackets}\nUltimo Pacchetto ID: ${packetId}\nCalibrazione CROMATICA: OK`);
                }
            }
        }

        function sampleDynamicPalette(hCtx, w, h) {
            const dynamic = [];
            const stripeStep = (w - 120) / 16;
            for (let i = 0; i < 16; i++) {
                const imgData = hCtx.getImageData(60 + (i * stripeStep) + (stripeStep / 2), 20, 1, 1).data;
                dynamic.push([imgData[0], imgData[1], imgData[2]]);
            }
            return dynamic;
        }

        function decodeColorAt(hCtx, x, y, palette) {
            const pixel = hCtx.getImageData(x, y, 1, 1).data;
            let minDistance = Infinity, bestMatch = 0;

            for (let i = 0; i < palette.length; i++) {
                const dist = Math.pow(pixel[0] - palette[i][0], 2) +
                             Math.pow(pixel[1] - palette[i][1], 2) +
                             Math.pow(pixel[2] - palette[i][2], 2);
                if (dist < minDistance) {
                    minDistance = dist;
                    bestMatch = i;
                }
            }
            return bestMatch;
        }

        function stopReceiver() {
            clearInterval(rxInterval);
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }

        function updateStatus(title, message) {
            statusOverlay.innerHTML = `<div class="status-title">${title}</div>${message}`;
        }

        // --- SERVICE WORKER PER FUNZIONAMENTO 100% OFFLINE (PWA) ---
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(caches.open('pwa-v2').then(c => c.add('./'))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>
</body>
</html>
